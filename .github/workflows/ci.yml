name: CI — Validar em dev e abrir PR

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  DBT_PROJECT_DIR: telecom
  DBT_PROFILES_DIR: profiles
  DBT_TARGET: dev

jobs:
  dbt-ci:
    name: Validar pipeline em dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar credenciais GCP
        run: |
          mkdir -p credentials
          echo '${{ secrets.GCP_CREDENTIALS }}' > credentials/gcp_credentials.json

      - name: dbt deps
        run: dbt deps --profiles-dir $DBT_PROFILES_DIR --project-dir $DBT_PROJECT_DIR

      - name: dbt build — staging
        run: dbt build --select staging --profiles-dir $DBT_PROFILES_DIR --project-dir $DBT_PROJECT_DIR

      - name: dbt build — intermediate
        run: dbt build --select intermediate --profiles-dir $DBT_PROFILES_DIR --project-dir $DBT_PROJECT_DIR

      - name: dbt build — marts
        run: dbt build --select marts --profiles-dir $DBT_PROFILES_DIR --project-dir $DBT_PROJECT_DIR

      - name: Limpar credenciais
        if: always()
        run: rm -f credentials/gcp_credentials.json

      - name: Abrir PR para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "ci: pipeline validado em dev — ${{ github.ref_name }}" \
            --body "Pipeline dbt validado com sucesso em dev. Pronto para deploy em prd." \
          || echo "PR já existe para esta branch"
