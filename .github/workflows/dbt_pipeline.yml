name: dbt Pipeline — Telecom ANATEL

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 1 * *'   # todo dia 1 do mês às 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DBT_PROJECT_DIR: telecom
  DBT_PROFILES_DIR: profiles
  DBT_TARGET: prd

jobs:
  pipeline:
    name: Executar pipeline dbt em prd
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar credenciais GCP
        run: |
          mkdir -p credentials
          echo '${{ secrets.GCP_CREDENTIALS }}' > credentials/gcp_credentials.json

      - name: dbt deps
        run: dbt deps --profiles-dir $DBT_PROFILES_DIR --project-dir $DBT_PROJECT_DIR

      - name: dbt build — staging
        run: dbt build --select staging --profiles-dir $DBT_PROFILES_DIR --project-dir $DBT_PROJECT_DIR

      - name: dbt build — intermediate
        run: dbt build --select intermediate --profiles-dir $DBT_PROFILES_DIR --project-dir $DBT_PROJECT_DIR

      - name: dbt build — marts
        run: dbt build --select marts --profiles-dir $DBT_PROFILES_DIR --project-dir $DBT_PROJECT_DIR

      - name: dbt docs generate
        run: dbt docs generate --profiles-dir $DBT_PROFILES_DIR --project-dir $DBT_PROJECT_DIR || true

      - name: Limpar credenciais
        if: always()
        run: rm -f credentials/gcp_credentials.json

      - name: Preparar _site
        run: |
          mkdir -p _site
          cp telecom/target/index.html _site/
          cp telecom/target/manifest.json _site/
          cp telecom/target/catalog.json _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
