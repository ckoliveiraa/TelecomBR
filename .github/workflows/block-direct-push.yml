name: Bloquear push direto na main

on:
  push:
    branches:
      - main

jobs:
  block-direct-push:
    name: Verificar origem do push
    runs-on: ubuntu-latest
    steps:
      - name: Rejeitar push direto
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" != Merge\ pull\ request* ]]; then
            echo "Push direto na main nao e permitido."
            echo "Crie uma branch, valide em dev e abra um PR."
            exit 1
          fi
          echo "Merge via PR detectado. OK."
