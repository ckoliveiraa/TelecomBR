telecom:
  target: "{{ env_var('DBT_TARGET', 'prd') }}"
  outputs:

    dev:
      type: bigquery
      method: service-account
      project: atmos-489611
      dataset: telecom_dev
      keyfile: "{{ env_var('GCP_KEYFILE', 'credentials/gcp_credentials.json') }}"
      location: US
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive

    prd:
      type: bigquery
      method: service-account
      project: atmos-489611
      dataset: telecom_prod
      keyfile: "{{ env_var('GCP_KEYFILE', 'credentials/gcp_credentials.json') }}"
      location: US
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: batch
